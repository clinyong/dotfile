# Gruvbox, matching Ghostty's light/dark palette through ANSI colors.
# Using terminal colors lets LazyGit follow Ghostty when macOS switches appearance.
gui:
  theme:
    activeBorderColor:
      - blue
      - bold
    inactiveBorderColor:
      - default
    searchingActiveBorderColor:
      - cyan
      - bold
    optionsTextColor:
      - yellow
    selectedLineBgColor:
      - blue
    inactiveViewSelectedLineBgColor:
      - default
      - bold
    cherryPickedCommitFgColor:
      - magenta
    cherryPickedCommitBgColor:
      - default
    markedBaseCommitFgColor:
      - yellow
    markedBaseCommitBgColor:
      - default
    unstagedChangesColor:
      - red
    defaultFgColor:
      - default
